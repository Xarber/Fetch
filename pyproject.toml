[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "openrecode-fetch"
version = "0.1.0"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "yt-dlp[default]", "argon2-cffi>=23,<26", "qrcode[pil]>=8,<9", "requests>=2.32,<3"]
[project.optional-dependencies]
test = ["pytest>=9.2.0,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
namespaces = false
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
