server {
    listen 80;
    server_name fetch.xcenter.it;
    access_log off;
    return 301 https://fetch.xcenter.it$request_uri;
}
server {
    listen 443 ssl;
    server_name fetch.xcenter.it;
    include /etc/nginx/snippets/xcenter-deny-hidden.conf;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    access_log off;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:18440;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
